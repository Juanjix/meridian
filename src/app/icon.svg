<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">

  <!-- Background: dark obsidian rounded square -->
  <rect width="32" height="32" rx="7" fill="#0A0A0A"/>

  <!-- Van body — side profile of a luxury high-roof van (facing right) -->
  <!-- Shape: steep windshield on left, flat roof, boxy rear -->
  <path
    d="M 4.5 21.5
       L 4.5 18.5
       L 6.5 18.5
       L 9.5 11.5
       L 24 11.5
       L 27 18.5
       L 27.5 21.5
       Z"
    fill="#D4AF5F"
    opacity="0.92"
  />

  <!-- Windshield glass — slightly darker to suggest glass -->
  <path
    d="M 6.5 18.5 L 9.5 11.5 L 15 11.5 L 13.5 18.5 Z"
    fill="#0A0A0A"
    opacity="0.52"
  />

  <!-- Side cabin window -->
  <rect x="15" y="12" width="7.5" height="5.8" rx="0.6" fill="#0A0A0A" opacity="0.44"/>

  <!-- Front headlight — warm white accent -->
  <rect x="4.5" y="18" width="1.8" height="2" rx="0.5" fill="#F5F0E8" opacity="0.65"/>

  <!-- Front wheel -->
  <circle cx="10" cy="23.5" r="3.6" fill="#0A0A0A"/>
  <circle cx="10" cy="23.5" r="2.2" fill="#D4AF5F" opacity="0.70"/>
  <circle cx="10" cy="23.5" r="0.85" fill="#0A0A0A"/>

  <!-- Rear wheel -->
  <circle cx="23.5" cy="23.5" r="3.6" fill="#0A0A0A"/>
  <circle cx="23.5" cy="23.5" r="2.2" fill="#D4AF5F" opacity="0.70"/>
  <circle cx="23.5" cy="23.5" r="0.85" fill="#0A0A0A"/>

</svg>
